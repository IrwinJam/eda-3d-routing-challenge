name: submissions

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Guard paths on submission PRs
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD)"
          echo "Changed files:"; echo "$changed"
          # Only guard PRs that add/modify submissions/. Pure toolkit PRs are fine.
          if echo "$changed" | grep -q '^submissions/'; then
            bad="$(echo "$changed" | grep -vE '^(submissions/|LEADERBOARD\.md$)' || true)"
            if [ -n "$bad" ]; then
              echo "::error::A submission PR may only change submissions/** and LEADERBOARD.md."
              echo "Disallowed changes:"; echo "$bad"
              exit 1
            fi
          fi

      - name: Run tests
        run: python -m unittest discover -s tests -q

      - name: Verify all submissions are legal
        run: python scripts/verify_submissions.py

      - name: Check LEADERBOARD.md is current
        run: python -m m3d.cli leaderboard-all --check
